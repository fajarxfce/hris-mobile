name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      scope:
        description: Verification scope
        type: choice
        default: all
        options: [all, apple]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}-${{ inputs.scope || 'all' }}
  cancel-in-progress: true

jobs:
  verify:
    if: github.event_name != 'workflow_dispatch' || inputs.scope != 'apple'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 -m unittest discover -s tool -p 'test_*.py'
      - run: >-
          xvfb-run -a ./gradlew :check
          :core:presentation:wasmJsBrowserTest :core:datastore:wasmJsBrowserTest :core:database:wasmJsBrowserTest
          :core:fileio:wasmJsBrowserTest
          :core:sync:data:wasmJsBrowserTest :core:workspace:domain:wasmJsBrowserTest :core:workspace:data:wasmJsBrowserTest
          :features:inbox:domain:wasmJsBrowserTest :features:inbox:data:wasmJsBrowserTest
          :features:home:presentation:wasmJsBrowserTest
          :features:workforce:domain:wasmJsBrowserTest :features:workforce:data:wasmJsBrowserTest
          :features:workforce:presentation:wasmJsBrowserTest
          :features:leave:domain:wasmJsBrowserTest :features:leave:data:wasmJsBrowserTest
          :core:common:wasmJsBrowserTest
          :features:payroll:domain:wasmJsBrowserTest :features:payroll:data:wasmJsBrowserTest
          :features:payroll:presentation:wasmJsBrowserTest
          :features:expenses:domain:wasmJsBrowserTest :features:expenses:data:wasmJsBrowserTest
          :features:expenses:presentation:wasmJsBrowserTest
          :features:leave:presentation:wasmJsBrowserTest :core:location:data:wasmJsBrowserTest
          :features:people:domain:wasmJsBrowserTest :features:people:data:wasmJsBrowserTest
          :features:people:presentation:wasmJsBrowserTest
          :core:documents:domain:wasmJsBrowserTest :core:documents:data:wasmJsBrowserTest
          :core:transfers:domain:wasmJsBrowserTest :core:transfers:data:wasmJsBrowserTest
          :features:files:presentation:wasmJsBrowserTest :core:worker:wasmJsBrowserTest
          :core:featureflags:domain:wasmJsBrowserTest :core:featureflags:data:wasmJsBrowserTest
          :core:identity:domain:wasmJsBrowserTest :core:identity:data:wasmJsBrowserTest
          :core:network:wasmJsBrowserTest :core:storage:wasmJsBrowserTest :core:securestorage:wasmJsBrowserTest
          :core:notifications:data:wasmJsBrowserTest :features:notifications:presentation:wasmJsBrowserTest
          :core:settings:data:wasmJsBrowserTest :core:localization:wasmJsBrowserTest :core:observability:wasmJsBrowserTest
          :core:security:domain:wasmJsBrowserTest :core:security:data:wasmJsBrowserTest :features:security:presentation:wasmJsBrowserTest
          :core:availability:domain:wasmJsBrowserTest :core:availability:data:wasmJsBrowserTest
          :apps:shared:wasmJsBrowserTest
          :apps:android:assembleDevDebug :apps:android:assembleStagingDebug :apps:android:assembleProdRelease
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports-and-android
          path: |
            **/build/reports/
            apps/android/build/outputs/apk/**/*.apk
  web:
    if: github.event_name != 'workflow_dispatch' || inputs.scope != 'apple'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: ./gradlew :apps:shared:wasmJsBrowserDistribution
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: apps/shared/build/dist/wasmJs/productionExecutable/
  apple:
    runs-on: macos-15
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26.3
        run: sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile iOS simulator tests
        run: >-
          ./gradlew :core:location:data:linkDebugTestIosSimulatorArm64
          :core:fileio:linkDebugTestIosSimulatorArm64
          :core:identity:data:linkDebugTestIosSimulatorArm64
          :core:notifications:data:linkDebugTestIosSimulatorArm64 --no-daemon
        timeout-minutes: 25
      - name: Run iOS simulator tests
        run: >-
          ./gradlew :core:location:data:iosSimulatorArm64Test :core:fileio:iosSimulatorArm64Test
          :core:identity:data:iosSimulatorArm64Test :core:notifications:data:iosSimulatorArm64Test --no-daemon
        timeout-minutes: 15
      - name: Build iOS simulator app
        timeout-minutes: 30
        run: >
          xcodebuild -project apps/ios/HrisMobile.xcodeproj -scheme HrisMobile
          -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator'
          -derivedDataPath apps/ios/build CODE_SIGNING_ALLOWED=NO ARCHS=arm64 build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-simulator-reports
          path: |
            **/build/reports/tests/iosSimulatorArm64Test/
            **/build/test-results/iosSimulatorArm64Test/
  windows:
    if: github.event_name != 'workflow_dispatch' || inputs.scope != 'apple'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew.bat :apps:shared:desktopJar
