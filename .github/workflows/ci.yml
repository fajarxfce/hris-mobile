name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: xvfb-run -a ./gradlew :check :apps:android:assembleDebug :apps:shared:wasmJsBrowserDistribution
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports-and-android
          path: |
            **/build/reports/
            apps/android/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: apps/shared/build/dist/wasmJs/productionExecutable/
  apple:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: >
          xcodebuild -project apps/ios/FluentStarter.xcodeproj -scheme FluentStarter
          -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator'
          -derivedDataPath apps/ios/build CODE_SIGNING_ALLOWED=NO ARCHS=arm64 build
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew.bat :apps:shared:desktopJar
