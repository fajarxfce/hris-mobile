name: Apple collaboration binding

on:
  workflow_dispatch:
  push:
    branches: [main, feat/communications]
    paths:
      - tool/collaboration-apple-proof/**
      - .github/workflows/collaboration-apple.yml
  pull_request:
    paths:
      - tool/collaboration-apple-proof/**
      - .github/workflows/collaboration-apple.yml

permissions:
  contents: read

jobs:
  binding:
    runs-on: macos-15
    timeout-minutes: 25
    defaults:
      run:
        working-directory: tool/collaboration-apple-proof
    steps:
      - uses: actions/checkout@v4
      - name: Record toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Exercise actual native crypto and encrypted-store recovery
        run: swift test
      - name: Compile the actual iOS device slice
        run: xcodebuild -scheme HrisCollaborationAppleProof -destination 'generic/platform=iOS' -derivedDataPath .build/device CODE_SIGNING_ALLOWED=NO build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apple-binding-resolution
          path: tool/collaboration-apple-proof/Package.resolved
          if-no-files-found: warn
          retention-days: 7
