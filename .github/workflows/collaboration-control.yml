name: Collaboration control

on:
  push:
    branches: [feat/communications]
    paths:
      - 'features/collaboration/**'
      - 'apps/shared/**'
      - 'apps/android/**'
      - 'apps/ios/**'
      - 'tool/test_application_push_fields.swift'
      - 'core/network/**'
      - 'core/observability/**'
      - 'core/database/**'
      - 'core/worker/**'
      - 'core/sync/**'
      - 'core/securestorage/**'
      - 'core/storage/**'
      - 'core/workspace/domain/**'
      - 'settings.gradle.kts'
      - 'gradle/libs.versions.toml'
      - 'build-logic/**'
      - '.github/workflows/collaboration-control.yml'
  pull_request:
    paths:
      - 'features/collaboration/**'
      - 'apps/shared/**'
      - 'apps/android/**'
      - 'apps/ios/**'
      - 'tool/test_application_push_fields.swift'
      - 'core/network/**'
      - 'core/observability/**'
      - 'core/database/**'
      - 'core/worker/**'
      - 'core/sync/**'
      - 'core/securestorage/**'
      - 'core/storage/**'
      - 'core/workspace/domain/**'
      - 'settings.gradle.kts'
      - 'gradle/libs.versions.toml'
      - 'build-logic/**'
      - '.github/workflows/collaboration-control.yml'
  workflow_dispatch:

env:
  ORG_GRADLE_PROJECT_networkInspectorDirectory: ${{ github.workspace }}/.work/network-inspector

permissions:
  contents: read

concurrency:
  group: collaboration-control-${{ github.ref }}
  # Finish the running proof; GitHub retains only the latest pending run.
  cancel-in-progress: false

jobs:
  portable:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Check out verified network inspector
        uses: actions/checkout@v4
        with:
          repository: fajarxfce/kmp-network-inspector
          ref: 742a2d1c2285c720cef80ea3913195f3ece388cc
          path: .work/network-inspector
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check setup transport and ownership
        run: >-
          xvfb-run -a ./gradlew --no-daemon --no-parallel --max-workers=2
          :core:worker:desktopTest :core:network:desktopTest :core:observability:desktopTest :core:worker:wasmJsBrowserTest :core:network:wasmJsBrowserTest :core:observability:wasmJsBrowserTest
          :core:workspace:domain:desktopTest :core:workspace:domain:wasmJsBrowserTest
          :features:collaboration:domain:desktopTest :features:collaboration:data:desktopTest
          :features:collaboration:data:testAndroidHostTest
          :features:collaboration:domain:wasmJsBrowserTest :features:collaboration:data:wasmJsBrowserTest
          :features:collaboration:presentation:desktopTest :features:collaboration:presentation:wasmJsBrowserTest
          :features:collaboration:data:assemble :features:collaboration:presentation:assemble
          formatCheck detekt architectureCheck
      - name: Check application bindings and platform compilation
        run: >-
          xvfb-run -a ./gradlew --no-daemon --no-parallel --max-workers=2
          :apps:shared:desktopTest --tests '*CollaborationBindingsTest' --tests '*CollaborationDeliveryWorkerTest' --tests '*CollaborationSpaceRecoveryWorkerTest' --tests '*ApplicationCollaborationLifetimeTest' --tests '*AppLocalWorkspaceTest' --tests '*ApplicationPushReceiverTest' --tests '*ApplicationPushIntegrationTest'
          :apps:android:assembleDevDebug :apps:android:lintDevDebug :apps:shared:compileKotlinWasmJs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: collaboration-control-portable
          path: |
            features/collaboration/**/build/test-results/
            core/workspace/domain/build/test-results/
            core/worker/build/test-results/
            core/network/build/test-results/
            core/observability/build/test-results/
            features/collaboration/presentation/build/reports/screenshots/
            apps/shared/build/test-results/
  apple:
    runs-on: macos-15
    timeout-minutes: 70
    env:
      ORG_GRADLE_PROJECT_appLinksConfigDirectory: .work/app-links-check
    steps:
      - uses: actions/checkout@v4
      - name: Check out verified network inspector
        uses: actions/checkout@v4
        with:
          repository: fajarxfce/kmp-network-inspector
          ref: 742a2d1c2285c720cef80ea3913195f3ece388cc
          path: .work/network-inspector
          persist-credentials: false
      - name: Select Xcode 26.3
        run: sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare public app-link test registrations
        run: python3 tool/check_app_links.py prepare --application-id dev.fajar.hris.mobile
      - name: Check Apple push envelope routing
        run: |
          mkdir -p apps/ios/build
          swiftc apps/ios/ApplicationPushFields.swift tool/test_application_push_fields.swift -o "$RUNNER_TEMP/hris-push-fields"
          "$RUNNER_TEMP/hris-push-fields" | tee apps/ios/build/push-fields.txt
      - name: Check Apple setup adapter
        run: >-
          ./gradlew --no-daemon --no-parallel --max-workers=2
          :core:workspace:domain:iosSimulatorArm64Test
          :core:database:iosSimulatorArm64Test
          :core:worker:iosSimulatorArm64Test :core:network:iosSimulatorArm64Test :core:observability:iosSimulatorArm64Test
          :features:collaboration:domain:iosSimulatorArm64Test
          :features:collaboration:data:iosSimulatorArm64Test
          :features:collaboration:presentation:iosSimulatorArm64Test
          :features:collaboration:presentation:compileKotlinIosArm64
          :features:collaboration:data:compileKotlinIosArm64
          :apps:shared:compileKotlinIosArm64
      - name: Build iOS application host
        timeout-minutes: 30
        env:
          DISTRIBUTION_BACKEND: remote
          API_BASE_URL: https://release.example.invalid/api/v1/
        run: >-
          xcodebuild -project apps/ios/HrisMobile.xcodeproj -scheme HrisMobile
          -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator'
          -derivedDataPath apps/ios/build CODE_SIGNING_ALLOWED=NO ARCHS=arm64 build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: collaboration-control-apple
          path: |
            apps/ios/build/push-fields.txt
            features/collaboration/**/build/test-results/
            core/workspace/domain/build/test-results/
            core/worker/build/test-results/
            core/network/build/test-results/
            core/observability/build/test-results/
            core/database/build/test-results/
