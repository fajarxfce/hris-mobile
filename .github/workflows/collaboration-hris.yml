name: Native collaboration through HRIS

on:
  workflow_dispatch:
  push:
    branches: [main, feat/communications]
    paths:
      - apps/collaboration-proof/**
      - apps/shared/**
      - features/collaboration/**
      - core/**
      - gradle/libs.versions.toml
      - gradle/verification-metadata.xml
      - tool/check_native_notifications.py
      - tool/test_native_notifications.py
      - tool/check_space_queue_adoption.py
      - tool/original_queue_seed.py
      - tool/test_original_queue_seed.py
      - .github/workflows/collaboration-hris.yml
  pull_request:
    paths:
      - apps/collaboration-proof/**
      - apps/shared/**
      - features/collaboration/**
      - core/**
      - gradle/libs.versions.toml
      - gradle/verification-metadata.xml
      - tool/check_native_notifications.py
      - tool/test_native_notifications.py
      - tool/check_space_queue_adoption.py
      - tool/original_queue_seed.py
      - tool/test_original_queue_seed.py
      - .github/workflows/collaboration-hris.yml

permissions:
  contents: read

concurrency:
  group: collaboration-hris-${{ github.ref }}
  # Finish the running proof; GitHub retains only the latest pending run.
  cancel-in-progress: false

jobs:
  android-hris:
    name: Android HRIS (${{ matrix.abi }})
    strategy:
      fail-fast: false
      matrix:
        abi: [x86_64, arm64-v8a]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          path: mobile
      - uses: actions/checkout@v4
        with:
          repository: fajarxfce/hris-platform
          # Includes the accepted two-restart/offline confirmed-native-queue scenario.
          ref: 940c181c735ad687dd78cd6cfaad8cf7814b34f2
          path: platform
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Build isolated Android SDK fixture before starting the emulator
        working-directory: mobile
        run: |
          python3 -m unittest discover -s tool -p 'test_native_notifications.py'
          python3 -W error::ResourceWarning -m unittest discover -s tool -p 'test_original_queue_seed.py'
          ./gradlew --no-daemon --no-parallel --max-workers=1 -PcollaborationProofAbi=${{ matrix.abi }} :features:collaboration:data:testAndroidHostTest :apps:collaboration-proof:testDebugUnitTest :apps:collaboration-proof:assembleDebug :apps:collaboration-proof:lintDebug
      - name: Verify fixture native ABI before runtime acceptance
        working-directory: mobile
        env:
          EXPECTED_SDK_ABI: ${{ matrix.abi }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, os, zipfile
          apk = Path('apps/collaboration-proof/build/outputs/apk/debug/collaboration-proof-debug.apk')
          abi = os.environ['EXPECTED_SDK_ABI']
          with zipfile.ZipFile(apk) as archive:
              libraries = {name for name in archive.namelist() if name.endswith('/libmatrix_sdk_ffi.so')}
              assert libraries == {'lib/' + abi + '/libmatrix_sdk_ffi.so'}, libraries
          output = Path('.work/native-abi.json')
          output.parent.mkdir(parents=True, exist_ok=True)
          output.write_text(json.dumps({'abi': abi, 'apkSha256': hashlib.sha256(apk.read_bytes()).hexdigest()}) + '\n')
          PY
      - name: Compile HRIS fixture and verify driver cleanup
        working-directory: platform
        run: |
          python3 -m unittest discover -s tool -p 'test_collaboration*.py'
          ./gradlew --no-daemon --no-parallel --max-workers=1 :apps:server:testClasses
      - name: Enable KVM for the owned runner emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        env:
          HRIS_COLLAB_NATIVE_APK: ${{ github.workspace }}/mobile/apps/collaboration-proof/build/outputs/apk/debug/collaboration-proof-debug.apk
          HRIS_COLLAB_NATIVE_ABI: ${{ matrix.abi }}
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          # The arm64-only APK exercises encrypted store restoration through the
          # native bridge; the ABI assertion above prevents an x86_64 fallback.
          avd-name: hris-mobile-dev
          emulator-port: 5560
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader -memory 2048 -cores 2
          script: |
            python3 ./mobile/tool/check_space_queue_adoption.py --serial emulator-5560 --apk "$HRIS_COLLAB_NATIVE_APK" --abi "$HRIS_COLLAB_NATIVE_ABI" --aapt2 "$ANDROID_HOME/build-tools/36.0.0/aapt2" --output ./mobile/.work/native-original-queue-proof
            python3 ./mobile/tool/check_native_notifications.py --serial emulator-5560 --apk "$HRIS_COLLAB_NATIVE_APK" --output ./mobile/.work/native-notification-proof --reply-system-ui
            ./platform/gradlew -p platform --no-daemon --no-parallel --max-workers=1 '-Dorg.gradle.jvmargs=-Xmx1536m -Dfile.encoding=UTF-8' :apps:server:cleanTest :apps:server:test --tests '*NativeCollaborationSdkInteropTest' --tests '*NativeCollaborationWorkerInteropTest' --tests '*NativeCollaborationScheduledInteropTest'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.abi == 'x86_64' && 'native-hris-evidence' || 'native-hris-arm64-evidence' }}
          path: |
            platform/.work/collaboration/*/result.json
            platform/.work/collaboration/*/verified.json
            platform/.work/collaboration/*/gateway-trace.json
            platform/.work/collaboration-worker/*/result.json
            platform/.work/collaboration-worker/*/acceptance.json
            platform/.work/collaboration-worker/*/gateway-trace.json
            platform/.work/collaboration-worker/*/gateway-observations.json
            platform/.work/collaboration-worker/*/native-worker-queued.json
            platform/.work/collaboration-worker/*/native-worker-restored.json
            platform/.work/collaboration-worker/*/stopped.json
            platform/.work/collaboration-worker/*/started.json
            platform/.work/collaboration-worker/*/network-before.json
            platform/apps/server/build/test-results/test/TEST-*NativeCollaboration*InteropTest.xml
            mobile/features/collaboration/data/build/test-results/testAndroidHostTest/TEST-*.xml
            mobile/apps/collaboration-proof/build/test-results/testDebugUnitTest/TEST-*.xml
            mobile/.work/native-notification-proof/
            mobile/.work/native-original-queue-proof/
            mobile/.work/native-abi.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
