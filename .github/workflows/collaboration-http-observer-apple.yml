name: Matrix HTTP observer Apple candidate

on:
  push:
    branches: [feat/matrix-http-observer-20261107]
    paths:
      - tool/build_collaboration_observer_apple.py
      - tool/apple-observer-sdk/build.json
      - tool/apple-observer-sdk/toolchain.patch
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: matrix-http-observer-apple-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apple:
    runs-on: macos-15
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          path: mobile
      - uses: actions/checkout@v4
        with:
          repository: matrix-org/matrix-rust-sdk
          ref: 8de215a0aa0026afa5754ae5f05a6d168d1a1d60
          path: sdk
          persist-credentials: false
      - name: Select Xcode 26.3
        run: sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
      - name: Build paired Swift and XCFramework for device, simulator and macOS
        run: >-
          python3 mobile/tool/build_collaboration_observer_apple.py
          --sdk "$GITHUB_WORKSPACE/sdk" --output "$GITHUB_WORKSPACE/artifact/apple"
      - name: Exercise actual Swift native HTTP, stop, replacement and cancellation
        run: >-
          python3 mobile/tool/apple-observer-sdk/run_proof.py
          --sdk "$GITHUB_WORKSPACE/sdk" --output "$GITHUB_WORKSPACE/artifact/apple/proof"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: matrix-http-observer-apple
          path: artifact/apple/
          if-no-files-found: error
          retention-days: 14
