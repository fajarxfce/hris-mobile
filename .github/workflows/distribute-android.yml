name: Distribute Android

on:
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        options: [staging, dev, prod]
        default: staging
        required: true
      version:
        description: 'Version name (for example 1.0.0)'
        required: true
      build:
        description: 'Increasing numeric build number'
        required: true
      backend:
        type: choice
        options: [demo, remote]
        default: demo
        required: true
      notes:
        description: 'Release notes for testers'
        required: false

permissions:
  contents: read

concurrency:
  group: internal-android-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  distribute:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: internal-${{ inputs.environment }}
    env:
      RELEASE_ENVIRONMENT: ${{ inputs.environment }}
      RELEASE_VERSION: ${{ inputs.version }}
      RELEASE_BUILD: ${{ inputs.build }}
      RELEASE_BACKEND: ${{ inputs.backend }}
      RELEASE_NOTES: ${{ inputs.notes }}
      API_BASE_URL: ${{ vars.API_BASE_URL }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
      - id: inputs
        run: python3 tool/distribution/configuration.py
      - name: Prepare signing and Firebase configuration
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          FIREBASE_ANDROID_CONFIG_BASE64: ${{ secrets.FIREBASE_ANDROID_CONFIG_BASE64 }}
          FIREBASE_ANDROID_APP_ID: ${{ vars.FIREBASE_ANDROID_APP_ID }}
          OIDC_CONFIG_BASE64: ${{ secrets.OIDC_CONFIG_BASE64 }}
        run: python3 tool/distribution/credentials.py android
      - name: Verify and build signed APK and bundle
        env:
          VARIANT: ${{ steps.inputs.outputs.variant }}
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/fluent-distribution/android.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ORG_GRADLE_PROJECT_backend: ${{ inputs.backend }}
          ORG_GRADLE_PROJECT_apiBaseUrl: ${{ vars.API_BASE_URL || 'https://api.example.com/' }}
        run: >-
          xvfb-run -a ./gradlew :check ":apps:android:assemble${VARIANT}Release"
          ":apps:android:bundle${VARIANT}Release" :apps:android:cyclonedxDirectBom
          -PsbomConfiguration="${RELEASE_ENVIRONMENT}ReleaseRuntimeClasspath"
          -PrequireSigning=true -PappEnvironment="$RELEASE_ENVIRONMENT"
          -PappVersion="$RELEASE_VERSION" -PappVersionCode="$RELEASE_BUILD"
      - name: Package checksums
        run: python3 tool/distribution/checksums.py android
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: android-${{ inputs.environment }}-${{ inputs.version }}-${{ inputs.build }}
          retention-days: 14
          path: build/distribution/artifacts/
          if-no-files-found: error
      - id: firebase
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          token_format: access_token
          create_credentials_file: false
          export_environment_variables: false
      - name: Upload to Firebase App Distribution
        env:
          FIREBASE_ACCESS_TOKEN: ${{ steps.firebase.outputs.access_token }}
          FIREBASE_ANDROID_APP_ID: ${{ vars.FIREBASE_ANDROID_APP_ID }}
          FIREBASE_TESTER_GROUPS: ${{ vars.FIREBASE_TESTER_GROUPS }}
          RELEASE_APK: apps/android/build/outputs/apk/${{ inputs.environment }}/release/android-${{ inputs.environment }}-release.apk
        run: python3 tool/distribution/firebase_distribute.py
      - name: Remove credentials
        if: always()
        run: python3 tool/distribution/credentials.py clean
